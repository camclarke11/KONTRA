[package]
name = "kontra-transcribe"
version = "0.0.0"
edition.workspace = true
license = "Apache-2.0"
publish = false
description = "Piano audio to MIDI notes and pedal: ByteDance's high-resolution piano transcription run with tract"

[lints]
workspace = true

[dependencies]
dirs = "5"
symphonia = { version = "0.5", default-features = false, features = ["aac", "aiff", "alac", "caf", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
tract-onnx = "0.23"
